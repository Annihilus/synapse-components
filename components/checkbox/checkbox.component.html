@if (isIndeterminate()) {
  <syn-icon class="remove" name="remove" />
} @else if (isChecked()) {
  <syn-icon class="check" name="check" />
}

<input
  #checkbox
  type="checkbox"
  class="hidden-checkbox"
  [checked]="isChecked()"
  [disabled]="disabled()"
  (focus)="setFocusState(true, $event)"
  (blur)="onBlur()"
  (change)="setCheckedState($event)"
/>
