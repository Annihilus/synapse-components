<div class="icon_container">
  <syn-icon class="icon" [name]="icon()" />
</div>

<div class="block">
  <span class="title">{{ title() }}</span>

  @if (message()) {
    <p class="message">{{ message() }}</p>
  }

  <div class="container">
    <button
      syn-button
      colorType="ghost"
      size="xs"
      [attr.aria-label]="dismissLabel()"
      (click)="dismiss.emit()"
    >
      <syn-icon name="close" />
    </button>
  </div>
</div>
