@if (!inline() && label()) {
  <label syn-label [attr.for]="fieldId">
    {{ label() }}

    @if (required()) {
      <span>*</span>
    }

    @if (tooltip()) {
      <syn-icon class="icon" name="question" />
    }
  </label>
}

<div class="input">
  @if (icon()) {
    <div class="icon">
      <ng-content select="syn-icon" />
    </div>
  }

  <div class="field">
    <input
      class="text-block"
      type="text"
      #element
      [id]="fieldId"
      [placeholder]="placeholder()"
      [disabled]="control.disabled()"
      [attr.size]="inline() ? 1 : null"
    >

    @if (!valueText()) {
      <span class="sizer" aria-hidden="true">{{ placeholder() }}</span>
    }
    <span class="sizer" aria-hidden="true">{{ valueText() }}</span>
  </div>

  <ng-content select="[synPostfix]" />
</div>

@if (!inline() && showError() && errorText()) {
  <div class="hint">
    {{ errorText() }}
  </div>
}
