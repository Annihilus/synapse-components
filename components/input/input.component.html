@if (!inline() && label()) {
  <label syn-label>
    {{ label() }}

    @if (required()) {
      <span>*</span>
    }

    @if (tooltip()) {
      <syn-icon class="icon" name="question" />
    }

  </label>
}

<div class="input">
  @if (icon()) {
    <div class="icon">
      <ng-content select="syn-icon"></ng-content>
    </div>
  }

  <div class="field">
    <input
      class="text-block"
      [placeholder]="placeholder()"
      [attr.size]="inline() ? 1 : null"
      (input)="onInput(element.value)"
      #element
      type="text"
    >

    @if (!valueText()) {
      <span class="sizer" aria-hidden="true">{{ placeholder() }}</span>
    }
    <span class="sizer" aria-hidden="true">{{ valueText() }}</span>
  </div>

  <ng-content select="[synPostfix]"></ng-content>

</div>

@if (!inline() && error()) {
  <div class="hint">
    {{ error() }}
  </div>
}
