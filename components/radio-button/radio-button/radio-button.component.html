<input
  #radio
  type="radio"
  class="hidden-radio"
  [attr.name]="groupName()"
  [checked]="isChecked()"
  [disabled]="isDisabled()"
  (focus)="setFocusState(true, $event)"
  (blur)="setFocusState(false)"
  (change)="onSelect()"
/>

<div class="state"></div>

@if (isChecked()) {
  <i class="check"></i>
}
