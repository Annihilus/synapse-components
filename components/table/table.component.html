<div class="table-header">
  @for (header of data().headers; track $index) {
    <div class="table-header-cell">
      {{ header }}
    </div>
  }
</div>

<div class="content">
  @for (row of data().rows; track $index) {
    <div class="row">
      @for (cell of row; track $index) {
        <div class="table-cell">
          {{ cell }}
        </div>
      }
    </div>
  }
</div>

<ng-content />
