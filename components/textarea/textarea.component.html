@if (label()) {
  <label syn-label [attr.for]="fieldId" [tooltip]="tooltip()" [required]="required()">
    {{ label() }}
  </label>
}

<div class="textarea">
  <textarea
    class="text-block"
    #element
    [id]="fieldId"
    [placeholder]="placeholder()"
    [disabled]="control.disabled()"
  ></textarea>
</div>

@if (showError() && errorText()) {
  <div class="hint">
    {{ errorText() }}
  </div>
}
