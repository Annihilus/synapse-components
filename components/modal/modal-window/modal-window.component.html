<div
  class="modal-window size-{{ size }}"
  tabindex="0"
>
  <ng-container #content></ng-container>

  @if (closeBtn) {
    <button
      class="close"
      syn-button
      colorType="ghost"
      size="s"
      (click)="close()"
    >
      <syn-icon name="close" />
    </button>
  }
</div>

<div
  class="overlay"
  tabindex="0"
  (click)="close()"
  (keydown.enter)="close()"
  (keydown.space)="close()"
></div>
