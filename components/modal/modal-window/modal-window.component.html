<div
  class="modal-window size-{{ size }}"
  #dialog
  role="dialog"
  aria-modal="true"
  tabindex="-1"
>
  <ng-container #content></ng-container>

  @if (closeBtn) {
    <button
      class="close"
      syn-button
      colorType="ghost"
      size="s"
      aria-label="Close"
      (click)="close()"
    >
      <syn-icon name="close" />
    </button>
  }
</div>

<div class="overlay" aria-hidden="true"></div>
