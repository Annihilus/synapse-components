<div
  class="modal syn-modal size-{{ size() }}"
  #dialog
  role="dialog"
  aria-modal="true"
  tabindex="-1"
>
  <ng-container #content></ng-container>
  <ng-content />

  @if (closeBtn()) {
    <button
      class="close"
      syn-button
      colorType="ghost"
      size="s"
      aria-label="Close"
      (click)="close()"
    >
      <syn-icon name="close" />
    </button>
  }
</div>

<div class="overlay syn-overlay-backdrop" aria-hidden="true"></div>
