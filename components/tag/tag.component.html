<div class="syn-tag-base container">
  @if (icon()) {
    <syn-icon class="icon" [name]="icon()" />
  }

  <ng-content />

  @if (canBeDeleted()) {
    <button
      class="close"
      type="button"
      [attr.aria-label]="removeLabel()"
      (click)="closed.emit()"
    >
      <syn-icon name="close" />
    </button>
  }
</div>
