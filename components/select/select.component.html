@if (label()) {
  <label class="label">{{ label() }}</label>
}

<div
  class="select"
  [iwDropdown]="{ content: selectTemplate, widthMinLimit: true }"
  #dropdown="iwDropdown"
  (isVisible)="active.set($event)"
>
  @if (icon()) {
    <syn-icon class="icon" name="{{ icon() }}" />
  }

  <div class="text-block">{{ displayText() }}</div>

  @if (canClear() && selectedValue()) {
    <button
      syn-icon-button
      class="reset"
      (click)="clearSelection(); $event.stopPropagation()"
    >
      <syn-icon name="close" />
    </button>
  }

  @if (active()) {
    <syn-icon class="chevron_up" name="chevron_up" />
  } @else {
    <syn-icon class="open-btn" name="chevron_down" />
  }
</div>

@if (hint()) {
  <div class="hint">{{ hint() }}</div>
}

<ng-template #selectTemplate>
  <ng-content select="[synHeader]" />

  @for (item of itemsWithMetadata(); track item) {
    <div
      class="option"
      tabindex="0"
      (click)="selectItem(item)"
      (keyup.enter)="selectItem(item)"
      role="option"
      [class.selected]="isSelected(item)"
      [attr.aria-selected]="isSelected(item)"
    >
      <ng-container
        [ngTemplateOutlet]="selectItemTemplate"
        [ngTemplateOutletContext]="{ item }"
      />
    </div>
  }

  <ng-content select="[synFooter]" />
</ng-template>

<ng-template #selectItemTemplate let-item="item">
  <div class="text_block">
    {{ item.displayName }}
  </div>
  <div class="state"></div>
</ng-template>
