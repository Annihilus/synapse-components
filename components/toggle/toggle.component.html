<span class="indicator">
  <ng-content />
</span>

<input
  #checkbox
  type="checkbox"
  class="hidden-checkbox"
  [checked]="isChecked()"
  [disabled]="disabled()"
  [attr.aria-label]="description() || null"
  (focus)="setFocusState(true)"
  (blur)="onBlur()"
  (change)="setCheckedState($event)"
/>

<div class="state"></div>
