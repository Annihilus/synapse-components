<div class="content">
  @if (icon()) {
    <syn-icon class="icon" [name]="iconName()" />
  }

  <div class="text_block">
    <span class="title">{{ title() }}</span>
    {{ description() }}
  </div>
  <div class="actions">
    <ng-content />
  </div>
</div>
@if (canBeClosed()) {
  <button class="close" syn-icon-button [attr.aria-label]="closeLabel()" (click)="closed.emit()">
    <syn-icon name="close" />
  </button>
}
